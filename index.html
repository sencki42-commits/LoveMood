<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveMood</title>
    
    <!-- Configuration PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff4d6d">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2589/2589175.png">

    <!-- SDK Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff4d6d;
            --bg-color: #fff5f7;
            --card-bg: #ffffff;
            --text-color: #2b2d42;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            position: relative;
        }

        .header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 1.8rem;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .partner-card {
            border: 2px solid #ffe3e8;
        }

        .mood-display {
            text-align: center;
        }

        .mood-emoji {
            font-size: 3.5rem;
            margin: 10px 0;
        }

        .mood-label {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
        }

        input[type="range"] {
            width: 100%;
            margin: 15px 0;
            accent-color: var(--primary);
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-action {
            background: #fff0f3;
            border: 1px solid #ffccd5;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .setup-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="text"], select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
        }

        button.primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-notif {
            background: #ffe3e8;
            color: var(--primary);
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .custom-item {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }

        .btn-remove {
            background: #ff4d6d;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>❤️ LoveMood</h1>
    </div>

    <!-- Configuration du Salon & Personnalisation -->
    <div class="card setup-box" id="setupSection">
        <h3>Configuration de la connexion</h3>
        <label for="roomCode">Code de Salon Secret :</label>
        <input type="text" id="roomCode" placeholder="Ex: notrecouple2026">
        
        <label for="userRole">Qui es-tu ?</label>
        <select id="userRole">
            <option value="p1">Partenaire 1</option>
            <option value="p2">Partenaire 2</option>
        </select>

        <h4>Personnaliser mes états d'humeur</h4>
        <div id="customMoodsList"></div>
        <button type="button" class="btn-action" onclick="ajouterOptionHumeur()">+ Ajouter une humeur</button>
        
        <button class="primary" onclick="sauvegarderConfig()" style="margin-top: 15px;">Enregistrer & Connexion</button>
    </div>

    <!-- Mon Humeur -->
    <div class="card" id="mainApp" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin: 0;">Mon Humeur</h2>
            <button class="btn-action" onclick="ouvrirReglages()">⚙️</button>
        </div>
        <div class="mood-display">
            <div class="mood-emoji" id="myEmoji">😊</div>
            <div class="mood-label" id="myLabel">Chargement...</div>
        </div>
        <input type="range" id="moodSlider" min="0" max="0" step="1" value="0" onchange="envoyerHumeur(this.value)" oninput="mettreAJourAperçuLocal(this.value)">

        <h3>Envoyer une attention :</h3>
        <div class="actions-grid">
            <button class="btn-action" onclick="envoyerAttention('🫂 Câlin virtuel')">🫂 Câlin</button>
            <button class="btn-action" onclick="envoyerAttention('💋 Bisou')">💋 Bisou</button>
            <button class="btn-action" onclick="envoyerAttention('☕ Pause Thé/Café')">☕ Thé/Café</button>
            <button class="btn-action" onclick="envoyerAttention('❤️ Je pense à toi')">❤️ Pensée</button>
        </div>

        <button class="btn-notif" onclick="activerNotifications()">🔔 Activer / Vérifier les notifications</button>
    </div>

    <!-- Humeur du Partenaire -->
    <div class="card partner-card" id="partnerApp" style="display: none;">
        <h2>Humeur de ma moitié</h2>
        <div class="mood-display">
            <div class="mood-emoji" id="partnerEmoji">❓</div>
            <div class="mood-label" id="partnerLabel">En attente...</div>
        </div>
        <div id="lastNotification" style="text-align: center; margin-top: 15px; font-style: italic; color: var(--primary);"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBsk0TRtP4S9VvghZDKhRyYcMf796iO5aw",
        authDomain: "lovemood-5cff0.firebaseapp.com",
        databaseURL: "https://lovemood-5cff0-default-rtdb.firebaseio.com",
        projectId: "lovemood-5cff0",
        storageBucket: "lovemood-5cff0.firebasestorage.app",
        messagingSenderId: "756633362983",
        appId: "1:756633362983:web:0b9d6994d05d9877faa402"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let humeursParDefaut = [
        { emoji: "😴", label: "Épuisé(e)" },
        { emoji: "🙁", label: "Pas au top" },
        { emoji: "😐", label: "Tranquille" },
        { emoji: "😊", label: "Heureux / Content(e)" },
        { emoji: "😍", label: "Super bien" }
    ];

    let humeurs = JSON.parse(localStorage.getItem('lovemood_custom_humeurs')) || humeursParDefaut;
    let roomCode = localStorage.getItem('lovemood_room') || '';
    let myRole = localStorage.getItem('lovemood_role') || '';
    let partnerRole = myRole === 'p1' ? 'p2' : 'p1';
    let dernierTimestamp = 0;

    afficherListeConfigHumeurs();

    if (roomCode && myRole) {
        demarrerApp();
    }

    function afficherListeConfigHumeurs() {
        const container = document.getElementById('customMoodsList');
        container.innerHTML = '';
        humeurs.forEach((h, index) => {
            const div = document.createElement('div');
            div.className = 'custom-item';
            div.innerHTML = `
                <input type="text" value="${h.emoji}" style="width: 40px; text-align:center;" onchange="modifierHumeur(${index}, 'emoji', this.value)">
                <input type="text" value="${h.label}" style="flex:1;" onchange="modifierHumeur(${index}, 'label', this.value)">
                <button class="btn-remove" onclick="supprimerHumeur(${index})">✕</button>
            `;
            container.appendChild(div);
        });
    }

    function ajouterOptionHumeur() {
        humeurs.push({ emoji: "✨", label: "Nouvelle humeur" });
        afficherListeConfigHumeurs();
    }

    function modifierHumeur(index, champ, valeur) {
        humeurs[index][champ] = valeur;
    }

    function supprimerHumeur(index) {
        if (humeurs.length <= 1) {
            alert("Il faut au moins une humeur !");
            return;
        }
        humeurs.splice(index, 1);
        afficherListeConfigHumeurs();
    }

    function sauvegarderConfig() {
        const inputRoom = document.getElementById('roomCode').value.trim();
        const selectRole = document.getElementById('userRole').value;

        if (!inputRoom) {
            alert('Veuillez entrer un code de salon.');
            return;
        }

        localStorage.setItem('lovemood_room', inputRoom);
        localStorage.setItem('lovemood_role', selectRole);
        localStorage.setItem('lovemood_custom_humeurs', JSON.stringify(humeurs));

        roomCode = inputRoom;
        myRole = selectRole;
        partnerRole = myRole === 'p1' ? 'p2' : 'p1';

        demarrerApp();
    }

    function ouvrirReglages() {
        document.getElementById('setupSection').style.display = 'flex';
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('partnerApp').style.display = 'none';
    }

    function activerNotifications() {
        if (!('Notification' in window)) {
            alert("Ce navigateur ne supporte pas les notifications.");
            return;
        }
        Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
                alert("Notifications activées !");
            } else {
                alert("Les notifications sont bloquées ou refusées.");
            }
        });
    }

    function declencherNotification(titre, corps) {
        if ('Notification' in window && Notification.permission === 'granted') {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.ready.then(registration => {
                    registration.showNotification(titre, {
                        body: corps,
                        icon: 'https://cdn-icons-png.flaticon.com/512/2589/2589175.png',
                        vibrate: [200, 100, 200]
                    });
                });
            } else {
                new Notification(titre, { body: corps });
            }
        }
    }

    function demarrerApp() {
        document.getElementById('setupSection').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('partnerApp').style.display = 'block';

        const slider = document.getElementById('moodSlider');
        slider.max = humeurs.length - 1;
        
        mettreAJourAperçuLocal(slider.value);

        // Écoute de l'humeur du partenaire
        database.ref(`salons/${roomCode}/${partnerRole}`).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const estNouveau = data.timestamp && data.timestamp > dernierTimestamp;

                if (data.emoji !== undefined && data.label !== undefined) {
                    document.getElementById('partnerEmoji').innerText = data.emoji;
                    document.getElementById('partnerLabel').innerText = data.label;

                    if (estNouveau && dernierTimestamp !== 0 && data.type === 'humeur') {
                        declencherNotification("Nouvelle humeur ! ❤️", `Votre moitié est : ${data.emoji} ${data.label}`);
                    }
                }

                if (data.derniereAttention) {
                    document.getElementById('lastNotification').innerText = `Reçu : ${data.derniereAttention}`;

                    if (estNouveau && dernierTimestamp !== 0 && data.type === 'attention') {
                        declencherNotification("Petite attention ! 💌", `Votre moitié vous a envoyé : ${data.derniereAttention}`);
                    }
                }

                if (data.timestamp) {
                    dernierTimestamp = data.timestamp;
                }
            }
        });
    }

    function mettreAJourAperçuLocal(index) {
        const h = humeurs[index] || humeurs[0];
        document.getElementById('myEmoji').innerText = h.emoji;
        document.getElementById('myLabel').innerText = h.label;
    }

    function envoyerHumeur(index) {
        const h = humeurs[index] || humeurs[0];
        if (roomCode && myRole) {
            database.ref(`salons/${roomCode}/${myRole}`).update({
                emoji: h.emoji,
                label: h.label,
                type: 'humeur',
                timestamp: Date.now()
            });
        }
    }

    function envoyerAttention(message) {
        if (roomCode && myRole) {
            database.ref(`salons/${roomCode}/${myRole}`).update({
                derniereAttention: message,
                type: 'attention',
                timestamp: Date.now()
            });
            alert(`Attention envoyée : ${message}`);
        }
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker OK'))
            .catch(err => console.error(err));
    }
</script>
</body>
</html>
