<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveMood</title>
    
    <!-- Configuration PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff4d6d">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2589/2589175.png">

    <!-- SDK Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #ff4d6d;
            --bg-color: #fff5f7;
            --card-bg: #ffffff;
            --text-color: #2b2d42;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
        }

        .header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 1.8rem;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .partner-card {
            border: 2px solid #ffe3e8;
        }

        .mood-display {
            text-align: center;
        }

        .mood-emoji {
            font-size: 3.5rem;
            margin: 10px 0;
        }

        .mood-label {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
        }

        input[type="range"] {
            width: 100%;
            margin: 15px 0;
            accent-color: var(--primary);
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-action {
            background: #fff0f3;
            border: 1px solid #ffccd5;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .setup-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="text"], select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
        }

        button.primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-notif {
            background: #ffe3e8;
            color: var(--primary);
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>❤️ LoveMood</h1>
    </div>

    <!-- Configuration du Salon -->
    <div class="card setup-box" id="setupSection">
        <h3>Configuration de la connexion</h3>
        <label for="roomCode">Code de Salon Secret :</label>
        <input type="text" id="roomCode" placeholder="Ex: notrecouple2026">
        
        <label for="userRole">Qui es-tu ?</label>
        <select id="userRole">
            <option value="p1">Partenaire 1</option>
            <option value="p2">Partenaire 2</option>
        </select>
        
        <button class="primary" onclick="sauvegarderConfig()">Rejoindre & Synchroniser</button>
    </div>

    <!-- Mon Humeur -->
    <div class="card" id="mainApp" style="display: none;">
        <h2>Mon Humeur</h2>
        <div class="mood-display">
            <div class="mood-emoji" id="myEmoji">😊</div>
            <div class="mood-label" id="myLabel">Heureux / Content(e)</div>
        </div>
        <input type="range" id="moodSlider" min="0" max="4" step="1" value="3" oninput="mettreAJourMonHumeur(this.value)">

        <h3>Envoyer une attention :</h3>
        <div class="actions-grid">
